[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-budget-sentinel"
version = "1.0.0"
description = "Autonomous zero-dependency spending guardrail and token cost circuit breaker for AI agents"
authors = [{ name = "1nc0gn30 • NullAI", email = "neal@nullai.tech" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-budget = "agent_budget_sentinel.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
